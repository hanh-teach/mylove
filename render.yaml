services:
  - type: web
    name: romantic-card-video-generator
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGING_API_KEY
        sync: false
      - key: OWNER_EMAILS
        sync: false
